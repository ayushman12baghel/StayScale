spring.application.name=stayscale-core-service
server.port=${CORE_SERVICE_PORT:8080}

spring.threads.virtual.enabled=true

spring.datasource.url=jdbc:postgresql://${POSTGRES_HOST:localhost}:${POSTGRES_PORT:5433}/${POSTGRES_DB:stayscale}
spring.datasource.username=${POSTGRES_USER:stayscale}
spring.datasource.password=${POSTGRES_PASSWORD:stayscale_dev}
spring.datasource.hikari.maximum-pool-size=20

spring.jpa.hibernate.ddl-auto=validate
spring.jpa.open-in-view=false
spring.jpa.properties.hibernate.jdbc.time_zone=UTC

spring.flyway.enabled=true
spring.flyway.locations=classpath:db/migration

management.endpoints.web.exposure.include=health,info
management.endpoint.health.probes.enabled=true

stayscale.cors.allowed-origins=${CORS_ALLOWED_ORIGINS:http://localhost:3000}
stayscale.seed.enabled=${STAYSCALE_SEED_ENABLED:true}
stayscale.seed.days-ahead=${STAYSCALE_SEED_DAYS_AHEAD:90}
